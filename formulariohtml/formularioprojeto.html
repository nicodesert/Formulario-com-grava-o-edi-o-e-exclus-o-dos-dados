<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cadastro de Usuários</title>
  <link rel="stylesheet" href="../css_do_projeto/estiloformulariocss.css" />
</head>
<body>
  <div class="app-root">
    <header class="topo">
      <h1>Cadastro de Usuários</h1>
      <div class="acoes-topo">
        <button id="btnTema" type="button">Alternar Tema</button>
        <button id="btnLimparTudo" type="button">Excluir Todos</button>
      </div>
    </header>

    <main class="container">
      <section class="form-section">
        <h2>Formulário do Usuário</h2>

        <form id="formPessoa" autocomplete="on">
          <input type="hidden" id="pessoaId" />

          <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required />
          </div>

          <div class="campo">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" list="email-suggestions" required />
            <datalist id="email-suggestions">
              <option value="exemplo@gmail.com">
              <option value="usuario@hotmail.com">
              <option value="contato@empresa.com">
            </datalist>
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required />
          </div>

          <div class="campo">
            <label for="confirmarSenha">Confirmar Senha</label>
            <input id="confirmarSenha" name="confirmarSenha" type="password" required />
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="number" />
          </div>

          <div class="campo">
            <label>Sexo</label>
            <div class="radio-group">
              <input type="radio" id="sexoM" name="sexo" value="Masculino" />
              <label for="sexoM">Masculino</label>

              <input type="radio" id="sexoF" name="sexo" value="Feminino" />
              <label for="sexoF">Feminino</label>

              <input type="radio" id="sexoO" name="sexo" value="Outro" />
              <label for="sexoO">Outro</label>
            </div>
          </div>

          <div class="campo">
            <label for="curso">Curso</label>
            <select id="curso" name="curso">
              <option value="">Selecione</option>
              <option value="Java">Java</option>
              <option value="JavaScript">JavaScript</option>
              <option value="Python">Python</option>
              <option value="C#">C#</option>
              <option value="PHP">PHP</option>
            </select>
          </div>

          <div class="botoes">
            <button id="btnGravar" type="submit">Gravar</button>
            <button id="btnCarregar" type="button">Carregar</button>
            <button id="btnCancelar" type="button">Cancelar</button>
          </div>
        </form>
      </section>

      <section class="lista-section">
        <h2>Usuários cadastrados</h2>
        <div id="mensagemNenhum" style="display:block">Nenhum registro encontrado.</div>

        <table id="tblPessoas" class="table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Email</th>
              <th>Telefone</th>
              <th>Sexo</th>
              <th>Curso</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <footer class="rodape">
      <small>Projeto com ES6, jQuery, LocalStorage, HTML e CSS.</small>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script type="module" src="../projeto.js/main.js"></script>
</body>
</html>
